
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075e54">
<title>MSD Chat</title>
<style>

:root {
  color-scheme: light;
  --primary: #5865f2;
  --primary-dark: #424edb;
  --ink: #182230;
  --muted: #718096;
  --surface: #ffffff;
  --page: #f3f5fb;
  --border: #e5e9f2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  background: var(--page);
  color: var(--ink);
  line-height: 1.5;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 20px 22px;
  background: #171c35;
  color: #ffffff;
  font-size: 25px;
  font-weight: 800;
  letter-spacing: -0.6px;
  box-shadow: 0 4px 18px rgba(20, 30, 70, 0.16);
}

main {
  width: 100%;
  max-width: 760px;
  margin: 28px auto;
  padding: 0 16px 32px;
}

.panel {
  background: var(--surface);
  padding: 22px;
  border: 1px solid var(--border);
  border-radius: 20px;
  margin-bottom: 20px;
  box-shadow: 0 8px 28px rgba(34, 47, 90, 0.055);
}

h2 {
  margin: 0 0 10px;
  font-size: 21px;
  font-weight: 750;
  letter-spacing: -0.4px;
}

p {
  margin: 8px 0 14px;
}

.small {
  font-size: 13px;
  color: var(--muted);
}

input {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 14px 15px;
  margin-top: 12px;
  border: 1px solid #dce2ee;
  border-radius: 12px;
  background: #f9faff;
  color: var(--ink);
  font: inherit;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.12);
  background: #ffffff;
}

button {
  width: 100%;
  padding: 13px 16px;
  margin-top: 12px;
  border: 0;
  border-radius: 12px;
  background: var(--primary);
  color: #ffffff;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}

button:hover {
  background: var(--primary-dark);
}

button:active {
  transform: scale(0.99);
}

button.secondary {
  background: #edf0f8;
  color: #303953;
}

button.secondary:hover {
  background: #dfe4f2;
}

.user {
  display: flex;
  align-items: center;
  gap: 12px;
  overflow-wrap: anywhere;
  padding: 13px;
  margin: 10px 0;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: #fbfcff;
  cursor: pointer;
}

.user button {
  margin-top: 0;
  flex-shrink: 0;
}

#users:empty {
  display: none;
}

#privateMessages,
#communityMessages {
  height: 300px;
  overflow-y: auto;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: #f6f8fd;
  scroll-behavior: smooth;
}

.message {
  width: fit-content;
  max-width: 92%;
  overflow-wrap: anywhere;
  padding: 11px 14px;
  margin: 9px 0;
  border: 1px solid #e0e6f5;
  border-radius: 14px 14px 14px 4px;
  background: #ffffff;
  color: #253047;
  box-shadow: 0 2px 6px rgba(30, 40, 80, 0.04);
}

.message strong {
  display: block;
  margin-bottom: 3px;
  color: var(--primary-dark);
  font-size: 12px;
}

#status {
  padding: 0 6px;
  color: var(--primary-dark);
  font-size: 14px;
  overflow-wrap: anywhere;
}

[hidden] {
  display: none !important;
}

@media (max-width: 480px) {
  header {
    padding: 17px;
    font-size: 22px;
  }

  main {
    margin: 16px auto;
    padding: 0 11px 24px;
  }

  .panel {
    padding: 17px;
    border-radius: 17px;
    margin-bottom: 15px;
  }

  h2 {
    font-size: 19px;
  }

  #privateMessages,
  #communityMessages {
    height: 260px;
  }
}

</style>
</head>
<body>
<header>💬 MSD Chat</header>
<main>
<section class="panel" id="authPanel">
<h2>Welcome to MSD Chat</h2>
<p>Create an account or sign in.</p>
<input id="email" type="email" placeholder="Email address" autocomplete="email">
<input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
<button id="register">Create account</button>
<button id="login" class="secondary">Sign in</button>
</section>

<div id="appPanel" hidden>
<section class="panel">
<p>Signed in as <strong id="who"></strong></p>
<button id="logout" class="secondary">Sign out</button>
</section>

<section class="panel">
<h2>👥 Private Chats</h2>
<p class="small">Select a user to open a private conversation.</p>
<div id="users">Loading users...</div>
</section>

<section class="panel" id="privatePanel" hidden>
<h2 id="privateTitle">Private conversation</h2>
<div id="privateMessages" aria-live="polite"></div>
<form id="privateForm">
<input id="privateInput" maxlength="2000" placeholder="Write a private message..." required>
<button type="submit">Send privately</button>
</form>
<button id="closePrivate" class="secondary">Close conversation</button>
</section>

<section class="panel">
<h2>🌎 Community Chat</h2>
<p class="small">Messages here are visible to all signed-in users.</p>
<div id="communityMessages" aria-live="polite"></div>
<form id="communityForm">
<input id="communityInput" maxlength="2000" placeholder="Write a community message..." required>
<button type="submit">Send message</button>
</form>
</section>
</div>
<p id="status" role="status" aria-live="polite"></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, addDoc,
  query, orderBy, limit, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

// IMPORTANT: Insert your own six Firebase config values below.
const firebaseConfig = {
  apiKey:  "AIzaSyBojogl1g0i2_zXK-B8A29cnIRM5pn3DjY",
  authDomain: "msd-chat-18e3a.firebaseapp.com",
  projectId: "msd-chat-18e3a",
  storageBucket: "msd-chat-18e3a.firebasestorage.app",
  messagingSenderId: "159171434081",
  appId: "1:159171434081:web:9997129ce58a5af47abc20",
};

const $ = id => document.getElementById(id);
const status = $("status");
const showStatus = message => { status.textContent = message; };

if (Object.values(firebaseConfig).some(v => v.startsWith("PASTE_"))) {
  showStatus("Setup needed: insert your six Firebase configuration values.");
} else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let stopCommunity = null;
  let stopUsers = null;
  let stopPrivate = null;
  let selectedUser = null;

  function stopListener(name) {
    if (name === "community" && stopCommunity) stopCommunity();
    if (name === "users" && stopUsers) stopUsers();
    if (name === "private" && stopPrivate) stopPrivate();
    if (name === "community") stopCommunity = null;
    if (name === "users") stopUsers = null;
    if (name === "private") stopPrivate = null;
  }

  function renderMessages(container, snapshot) {
    container.replaceChildren();
    snapshot.forEach(item => {
      const data = item.data();
      const div = document.createElement("div");
      div.className = "message";
      const sender = document.createElement("strong");
      sender.textContent = (data.senderEmail || "User") + ": ";
      const body = document.createElement("span");
      body.textContent = data.text || "";
      div.append(sender, body);
      container.append(div);
    });
    container.scrollTop = container.scrollHeight;
  }

  $("register").onclick = async () => {
    try {
      await createUserWithEmailAndPassword(
        auth, $("email").value.trim(), $("password").value
      );
      showStatus("Account created!");
    } catch (e) { showStatus(e.message); }
  };

  $("login").onclick = async () => {
    try {
      await signInWithEmailAndPassword(
        auth, $("email").value.trim(), $("password").value
      );
      showStatus("Signed in!");
    } catch (e) { showStatus(e.message); }
  };

  $("logout").onclick = async () => {
    try { await signOut(auth); }
    catch (e) { showStatus(e.message); }
  };

  onAuthStateChanged(auth, async user => {
    stopListener("community");
    stopListener("users");
    stopListener("private");
    selectedUser = null;
    $("privatePanel").hidden = true;
    $("authPanel").hidden = !!user;
    $("appPanel").hidden = !user;
    $("communityMessages").replaceChildren();
    $("users").replaceChildren();

    if (!user) {
      $("who").textContent = "";
      return;
    }

    $("who").textContent = user.email || "User";

    try {
      // Register this account in the user directory.
      await setDoc(doc(db, "users", user.uid), {
        uid: user.uid,
        email: user.email || "User",
        updatedAt: serverTimestamp()
      }, { merge: true });

      // Community chat
      const communityQuery = query(
        collection(db, "messages"),
        orderBy("createdAt", "asc"),
        limit(100)
      );
      stopCommunity = onSnapshot(communityQuery, snapshot => {
        renderMessages($("communityMessages"), snapshot);
      }, e => showStatus("Community chat error: " + e.message));

      // Registered users directory
      stopUsers = onSnapshot(collection(db, "users"), snapshot => {
        const box = $("users");
        box.replaceChildren();
        let found = false;

        snapshot.forEach(item => {
          const person = item.data();
          if (!person.uid || person.uid === user.uid) return;
          found = true;

          const row = document.createElement("div");
          row.className = "user";
          const label = document.createElement("div");
          label.textContent = person.email || "MSD Chat user";
          const openButton = document.createElement("button");
          openButton.textContent = "Open private chat";
          openButton.onclick = () => openPrivateChat(
            user, person.uid, person.email || "MSD Chat user"
          );
          row.append(label, openButton);
          box.append(row);
        });

        if (!found) {
          box.textContent = "No other registered users found yet. Ask another user to sign in to MSD Chat once.";
        }
      }, e => showStatus("User list error: " + e.message));

    } catch (e) {
      showStatus("Setup error: " + e.message);
    }
  });

  async function openPrivateChat(user, otherUid, otherEmail) {
    stopListener("private");
    selectedUser = { uid: otherUid, email: otherEmail };
    $("privatePanel").hidden = false;
    $("privateTitle").textContent = "Private chat with " + otherEmail;
    $("privateMessages").replaceChildren();
    showStatus("Opening private chat...");

    try {
      const members = [user.uid, otherUid].sort();
      const chatId = members.join("__");
      const chatRef = doc(db, "chats", chatId);

      // Create the conversation if needed, or update its timestamp.
      await setDoc(chatRef, {
        members,
        updatedAt: serverTimestamp()
      }, { merge: true });

      const privateQuery = query(
        collection(db, "chats", chatId, "messages"),
        orderBy("createdAt", "asc"),
        limit(100)
      );

      stopPrivate = onSnapshot(privateQuery, snapshot => {
        renderMessages($("privateMessages"), snapshot);
        showStatus("");
      }, e => showStatus("Private chat error: " + e.message));
    } catch (e) {
      showStatus("Could not open private chat: " + e.message);
    }
  }

  $("privateForm").onsubmit = async event => {
    event.preventDefault();
    const user = auth.currentUser;
    const text = $("privateInput").value.trim();
    if (!user || !selectedUser || !text) return;

    const members = [user.uid, selectedUser.uid].sort();
    const chatId = members.join("__");

    try {
      await addDoc(collection(db, "chats", chatId, "messages"), {
        senderId: user.uid,
        senderEmail: user.email || "User",
        text,
        createdAt: serverTimestamp()
      });
      $("privateInput").value = "";
      showStatus("");
    } catch (e) {
      showStatus("Could not send private message: " + e.message);
    }
  };

  $("closePrivate").onclick = () => {
    stopListener("private");
    selectedUser = null;
    $("privatePanel").hidden = true;
  };

  $("communityForm").onsubmit = async event => {
    event.preventDefault();
    const user = auth.currentUser;
    const text = $("communityInput").value.trim();
    if (!user || !text) return;

    try {
      await addDoc(collection(db, "messages"), {
        senderId: user.uid,
        senderEmail: user.email || "User",
        text,
        createdAt: serverTimestamp()
      });
      $("communityInput").value = "";
      showStatus("");
    } catch (e) {
      showStatus("Could not send community message: " + e.message);
    }
  };
}
</script>
</body>
</html>
