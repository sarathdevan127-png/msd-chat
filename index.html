<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101225">
  <title>MSD Chat</title>
<style>
:root {
  color-scheme: dark;
  --primary: #8175ff;
  --page: #080a18;
  --surface: #141625;
  --border: #292c43;
  --ink: #f4f5ff;
  --muted: #969bb8;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  font-family: Inter, "Segoe UI", Arial, sans-serif;
  background: radial-gradient(ellipse at top left, #202052 0%, transparent 45%),
              radial-gradient(ellipse at bottom right, #102c45 0%, transparent 40%), var(--page);
  color: var(--ink); line-height: 1.6;
}
header {
  position: sticky; top: 0; z-index: 10; padding: 20px 22px;
  background: rgba(15,17,36,.96); color: #fff; font-size: 25px; font-weight: 800;
  border-bottom: 1px solid #343254; box-shadow: 0 8px 35px #0005;
}
main { width: 100%; max-width: 820px; margin: 28px auto; padding: 0 16px 32px; }
.panel {
  background: linear-gradient(145deg,#191b30,#111320); padding: 22px;
  border: 1px solid #30324c; border-radius: 24px; margin-bottom: 22px;
  box-shadow: 0 16px 45px #0004;
}
h2 { margin: 0 0 10px; font-size: 21px; font-weight: 750; color: #fff; letter-spacing: -.4px; }
p { margin: 8px 0 14px; color: var(--muted); }
.small { font-size: 13px; color: var(--muted); }
input {
  display: block; width: 100%; min-width: 0; padding: 14px; margin-top: 12px;
  border: 1px solid #343b63; border-radius: 12px; background: #101225; color: #fff;
  -webkit-text-fill-color: #fff; caret-color: #fff; font: inherit; outline: none;
}
input::placeholder { color: #a5aecb; -webkit-text-fill-color: #a5aecb; }
input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px #8175ff30; }
button {
  width: 100%; padding: 13px 16px; margin-top: 12px; border: 1px solid #a855f773;
  border-radius: 14px; background: linear-gradient(135deg,#7c3aed,#2563eb);
  color: #fff; font: inherit; font-weight: 700; cursor: pointer;
  box-shadow: 0 4px 18px #7c3aed38; transition: transform .2s, filter .2s;
}
button:hover { filter: brightness(1.15); }
button:active { transform: scale(.98); }
button.secondary { background: #252840; color: #e4e6ff; box-shadow: none; }
.user {
  display: flex; align-items: center; gap: 12px; overflow-wrap: anywhere; padding: 13px;
  margin: 10px 0; border: 1px solid #30334c; border-radius: 17px;
  background: #191b2e; cursor: pointer;
}
.user > div { min-width: 0; flex: 1; }
.user button { width: auto; margin-top: 0; flex-shrink: 0; }
#users:empty { display: none; }
#privateMessages, #communityMessages {
  height: 280px; overflow-y: auto; padding: 16px; border: 1px solid #2c2e47;
  border-radius: 19px; background: #0d0f1c; scroll-behavior: smooth;
}
.message {
  width: fit-content; max-width: 96%; overflow-wrap: anywhere; padding: 12px 15px;
  margin: 11px 0; border: 1px solid #373b59; border-radius: 18px 18px 18px 5px;
  background: linear-gradient(145deg,#252941,#1b1e31); color: #f5f6ff; box-shadow: 0 5px 16px #0002;
}
.message strong { display: block; margin-bottom: 3px; color: #a99fff; font-size: 12px; letter-spacing: .2px; }
.message-text { white-space: pre-wrap; }
.reaction-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.reaction-button {
  width: auto; min-width: 42px; margin: 0; padding: 5px 9px; border-radius: 999px;
  background: #20243b; border: 1px solid #414665; box-shadow: none;
  font-size: 14px; line-height: 1.35;
}
.reaction-button.selected { background: #453080; border-color: #b49aff; box-shadow: 0 0 0 1px #b49aff55; }
.reaction-button.add-reaction { min-width: 38px; font-size: 16px; background: #171a2c; }
#status { padding: 0 6px; color: #a99fff; font-size: 14px; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
@media (max-width: 480px) {
  header { padding: 17px; font-size: 22px; }
  main { margin: 15px auto; padding: 0 11px 25px; }
  .panel { padding: 17px; border-radius: 20px; }
  h2 { font-size: 19px; }
  #privateMessages, #communityMessages { height: 280px; }
  .user { align-items: stretch; flex-direction: column; }
  .user button { width: 100%; }
}
</style>
</head>
<body>
<header>💬 MSD Chat</header>
<main>
<section class="panel" id="authPanel">
  <h2>Welcome to MSD Chat</h2>
  <p>Create an account or sign in.</p>
  <input id="email" type="email" placeholder="Email address" autocomplete="email">
  <input id="password" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <button id="register">Create account</button>
  <button id="login" class="secondary">Sign in</button>
</section>

<div id="appPanel" hidden>
  <section class="panel">
    <p>Signed in as <strong id="who"></strong></p>
    <button id="logout" class="secondary">Sign out</button>
  </section>

  <section class="panel">
    <h2>👥 Private Chats</h2>
    <p class="small">Select a user to open a private conversation.</p>
    <div id="users">Loading users...</div>
  </section>

  <section class="panel" id="privatePanel" hidden>
    <h2 id="privateTitle">Private conversation</h2>
    <div id="privateMessages" aria-live="polite"></div>
    <form id="privateForm">
      <input id="privateInput" maxlength="2000" placeholder="Write a private message..." required>
      <button type="submit">Send privately</button>
    </form>
    <button id="closePrivate" class="secondary">Close conversation</button>
  </section>

  <section class="panel">
    <h2>🌎 Community Chat</h2>
    <p class="small">Messages here are visible to all signed-in users.</p>
    <div id="communityMessages" aria-live="polite"></div>
    <form id="communityForm">
      <input id="communityInput" maxlength="2000" placeholder="Write a community message..." required>
      <button type="submit">Send message</button>
    </form>
  </section>
</div>
<p id="status" role="status" aria-live="polite"></p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {
  getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteField,
  query, orderBy, limit, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBojogl1g0i2_zXK-B8A29cnIRM5pn3DjY",
  authDomain: "msd-chat-18e3a.firebaseapp.com",
  projectId: "msd-chat-18e3a",
  storageBucket: "msd-chat-18e3a.firebasestorage.app",
  messagingSenderId: "159171434081",
  appId: "1:159171434081:web:9997129ce58a5af47abc20"
};

const $ = id => document.getElementById(id);
const status = $("status");
const showStatus = message => { status.textContent = message; };
const REACTION_CHOICES = ["❤️", "😂", "👍", "😮", "😢", "🔥"];
const REACTION_FIELD = uid => "reactions." + uid;

if (Object.values(firebaseConfig).some(v => v.startsWith("PASTE_"))) {
  showStatus("Setup needed: insert your Firebase configuration values.");
} else {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let stopCommunity = null;
  let stopUsers = null;
  let stopPrivate = null;
  let selectedUser = null;

  function stopListener(name) {
    if (name === "community" && stopCommunity) stopCommunity();
    if (name === "users" && stopUsers) stopUsers();
    if (name === "private" && stopPrivate) stopPrivate();
    if (name === "community") stopCommunity = null;
    if (name === "users") stopUsers = null;
    if (name === "private") stopPrivate = null;
  }

  function makeReactionButton(emoji, count, selected, onClick, label) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "reaction-button" + (selected ? " selected" : "");
    button.textContent = count ? `${emoji} ${count}` : emoji;
    button.setAttribute("aria-label", label || `${emoji} reaction`);
    button.title = label || `${emoji} reaction`;
    button.onclick = onClick;
    return button;
  }

  function renderMessages(container, snapshot, messageCollectionPath) {
    container.replaceChildren();
    const currentUser = auth.currentUser;

    snapshot.forEach(item => {
      const data = item.data();
      const div = document.createElement("div");
      div.className = "message";

      const sender = document.createElement("strong");
      sender.textContent = (data.senderEmail || "User") + ": ";

      const body = document.createElement("div");
      body.className = "message-text";
      body.textContent = data.text || "";
      div.append(sender, body);

      const reactionRow = document.createElement("div");
      reactionRow.className = "reaction-row";
      const reactions = data.reactions && typeof data.reactions === "object" ? data.reactions : {};

      REACTION_CHOICES.forEach(emoji => {
        const usersWhoReacted = Object.entries(reactions).filter(([, value]) => value === emoji);
        const count = usersWhoReacted.length;
        const selected = !!currentUser && reactions[currentUser.uid] === emoji;
        reactionRow.appendChild(makeReactionButton(emoji, count, selected, async () => {
          const user = auth.currentUser;
          if (!user) {
            showStatus("Please sign in to react.");
            return;
          }
          const messageRef = doc(db, ...messageCollectionPath, item.id);
          try {
            if (reactions[user.uid] === emoji) {
              await updateDoc(messageRef, { [REACTION_FIELD(user.uid)]: deleteField() });
            } else {
              await updateDoc(messageRef, { [REACTION_FIELD(user.uid)]: emoji });
            }
            showStatus("");
          } catch (error) {
            showStatus("Could not save reaction: " + error.message);
          }
        }, `React ${emoji}; ${count} reaction${count === 1 ? "" : "s"}`));
      });

      const addButton = makeReactionButton("＋", 0, false, () => {
        const picker = document.createElement("div");
        picker.className = "reaction-row";
        REACTION_CHOICES.forEach(emoji => {
          picker.appendChild(makeReactionButton(emoji, 0, false, async () => {
            const user = auth.currentUser;
            if (!user) return;
            const messageRef = doc(db, ...messageCollectionPath, item.id);
            try {
              await updateDoc(messageRef, { [REACTION_FIELD(user.uid)]: emoji });
              showStatus("");
            } catch (error) {
              showStatus("Could not save reaction: " + error.message);
            }
          }, `Choose ${emoji}`));
        });
        if (reactionRow.nextSibling && reactionRow.nextSibling.classList.contains("reaction-picker")) {
          reactionRow.nextSibling.remove();
        } else {
          picker.classList.add("reaction-picker");
          reactionRow.after(picker);
        }
      }, "Choose a reaction");
      addButton.classList.add("add-reaction");
      reactionRow.appendChild(addButton);
      div.appendChild(reactionRow);
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
  }

  $("register").onclick = async () => {
    try {
      await createUserWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
      showStatus("Account created!");
    } catch (e) { showStatus(e.message); }
  };

  $("login").onclick = async () => {
    try {
      await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
      showStatus("Signed in!");
    } catch (e) { showStatus(e.message); }
  };

  $("logout").onclick = async () => {
    try { await signOut(auth); }
    catch (e) { showStatus(e.message); }
  };

  onAuthStateChanged(auth, async user => {
    stopListener("community");
    stopListener("users");
    stopListener("private");
    selectedUser = null;
    $("privatePanel").hidden = true;
    $("authPanel").hidden = !!user;
    $("appPanel").hidden = !user;
    $("communityMessages").replaceChildren();
    $("users").replaceChildren();

    if (!user) {
      $("who").textContent = "";
      return;
    }
    $("who").textContent = user.email || "User";

    try {
      await setDoc(doc(db, "users", user.uid), {
        uid: user.uid, email: user.email || "User", updatedAt: serverTimestamp()
      }, { merge: true });

      const communityQuery = query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(100));
      stopCommunity = onSnapshot(communityQuery, snapshot => {
        renderMessages($("communityMessages"), snapshot, ["messages"]);
      }, e => showStatus("Community chat error: " + e.message));

      stopUsers = onSnapshot(collection(db, "users"), snapshot => {
        const box = $("users");
        box.replaceChildren();
        let found = false;
        snapshot.forEach(item => {
          const person = item.data();
          if (!person.uid || person.uid === user.uid) return;
          found = true;
          const row = document.createElement("div");
          row.className = "user";
          const label = document.createElement("div");
          label.textContent = person.email || "MSD Chat user";
          const openButton = document.createElement("button");
          openButton.textContent = "Open private chat";
          openButton.onclick = () => openPrivateChat(user, person.uid, person.email || "MSD Chat user");
          row.append(label, openButton);
          box.append(row);
        });
        if (!found) {
          box.textContent = "No other registered users found yet. Ask another user to sign in to MSD Chat once.";
        }
      }, e => showStatus("User list error: " + e.message));
    } catch (e) {
      showStatus("Setup error: " + e.message);
    }
  });

  async function openPrivateChat(user, otherUid, otherEmail) {
    stopListener("private");
    selectedUser = { uid: otherUid, email: otherEmail };
    $("privatePanel").hidden = false;
    $("privateTitle").textContent = "Private chat with " + otherEmail;
    $("privateMessages").replaceChildren();
    showStatus("Opening private chat...");
    try {
      const members = [user.uid, otherUid].sort();
      const chatId = members.join("__");
      const chatRef = doc(db, "chats", chatId);
      await setDoc(chatRef, { members, updatedAt: serverTimestamp() }, { merge: true });

      const privateQuery = query(
        collection(db, "chats", chatId, "messages"),
        orderBy("createdAt", "asc"), limit(100)
      );
      stopPrivate = onSnapshot(privateQuery, snapshot => {
        renderMessages($("privateMessages"), snapshot, ["chats", chatId, "messages"]);
        showStatus("");
      }, e => showStatus("Private chat error: " + e.message));
    } catch (e) {
      showStatus("Could not open private chat: " + e.message);
    }
  }

  $("privateForm").onsubmit = async event => {
    event.preventDefault();
    const user = auth.currentUser;
    const text = $("privateInput").value.trim();
    if (!user || !selectedUser || !text) return;
    const members = [user.uid, selectedUser.uid].sort();
    const chatId = members.join("__");
    try {
      await addDoc(collection(db, "chats", chatId, "messages"), {
        senderId: user.uid, senderEmail: user.email || "User", text,
        reactions: {}, createdAt: serverTimestamp()
      });
      $("privateInput").value = "";
      showStatus("");
    } catch (e) {
      showStatus("Could not send private message: " + e.message);
    }
  };

  $("closePrivate").onclick = () => {
    stopListener("private");
    selectedUser = null;
    $("privatePanel").hidden = true;
  };

  $("communityForm").onsubmit = async event => {
    event.preventDefault();
    const user = auth.currentUser;
    const text = $("communityInput").value.trim();
    if (!user || !text) return;
    try {
      await addDoc(collection(db, "messages"), {
        senderId: user.uid, senderEmail: user.email || "User", text,
        reactions: {}, createdAt: serverTimestamp()
      });
      $("communityInput").value = "";
      showStatus("");
    } catch (e) {
      showStatus("Could not send community message: " + e.message);
    }
  };
}
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function (error) {
      console.error("Service worker registration failed:", error);
    });
  });
}
</script>
</body>
</html>
